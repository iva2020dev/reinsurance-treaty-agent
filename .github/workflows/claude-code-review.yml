name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Increase from 1 to 50
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Switched from the code-review@claude-code-plugins marketplace
          # plugin to a self-contained prompt on 2026-08-14, on the theory
          # that the marketplace loader was causing an opaque
          # "result is_error:true" a few seconds into every run. That theory
          # was wrong: as of 2026-08-15, the same is_error:true persisted
          # with a direct prompt too. Root-caused with a temporary
          # show_full_output: true — the actual failure is
          # error: "billing_error" / "Credit balance is too low" on the
          # ANTHROPIC_API_KEY secret's account, unrelated to the prompt or
          # marketplace. No code/workflow change fixes this — the Anthropic
          # Console account backing that key needs credit added.
          prompt: |
            Review this pull request (${{ github.repository }}/pull/${{ github.event.pull_request.number }}) and post a comment with:
            1. A short summary of what changed
            2. Potential bugs or edge cases
            3. Security concerns, if any
            4. Up to 3 concrete suggestions, only if significant

            Be concise. Skip praise. Only flag real issues.

            Use `gh pr comment` to post the top-level review comment.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific code issues. Only post
            GitHub comments - don't submit review text as messages.
          claude_args: >-
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

